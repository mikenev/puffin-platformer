name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary and Web templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-web-v1

      - name: Download Godot and Web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_TAG}
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          # The full template archive is ~1.3 GB; keep only the Web templates.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_TAG}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dest"
          rm /tmp/templates.tpz /tmp/godot.zip
          ls -la "$dest"

      - name: Export Web preset
        run: |
          set -euo pipefail
          GODOT=~/godot/Godot_v${GODOT_TAG}_linux.x86_64
          chmod +x "$GODOT"
          mkdir -p build/web
          "$GODOT" --headless --import . || true
          "$GODOT" --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          rm -f build/web/.gdignore
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
